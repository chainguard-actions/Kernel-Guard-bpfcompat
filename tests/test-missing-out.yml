name: Test missing out error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake bpfcompat binary, artifact, and matrix
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" <<'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"
          touch /tmp/prog.bpf.o
          cat > /tmp/matrix.yaml <<'EOF'
          targets: []
          EOF

      - name: Run action with artifact and matrix but no out
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "/tmp/prog.bpf.o"
          matrix: "/tmp/matrix.yaml"
          # No out — should fail with "out is required" error

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when out is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when out was not provided"
