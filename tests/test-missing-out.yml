name: Test missing out path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Place a fake bpfcompat binary so the action doesn't fail on binary-not-found
      # before reaching the out-path validation check.
      - name: Create fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

      # Create a fake artifact file so the artifact-not-found check passes
      - name: Create fake artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          touch "$GITHUB_WORKSPACE/artifacts/test.bpf.o"

      - name: Run action (expect failure - no out path)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "artifacts/test.bpf.o"
          matrix: "tests/fixtures/minimal-matrix.yaml"
          # No out — should fail
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when out is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when out path was not provided"
