name: Test missing out path error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and artifact
        run: |
          mkdir -p bin
          cat > bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x bin/bpfcompat
          # Create a fake .bpf.o artifact
          touch /tmp/test.bpf.o

      - name: Run action expecting failure (no out path)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "/tmp/test.bpf.o"
          matrix: "dev-one"
        continue-on-error: true

      - name: Assert action failed due to missing out path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when out path is not provided, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when out path was missing"
