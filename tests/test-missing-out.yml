name: Test missing out path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake binary, artifact, and matrix files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"
          # Create a dummy .bpf.o artifact
          touch "$GITHUB_WORKSPACE/dummy.bpf.o"
          # Create a minimal matrix YAML
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'YAML'
          targets:
            - name: linux-5.15
              kernel: "5.15"
          YAML

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          artifact: "dummy.bpf.o"
          matrix: "matrix.yaml"
          # No out — should fail with "out is required"

      - name: Assert action failed with missing out error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when out is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when out is missing"
