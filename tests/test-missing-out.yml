name: Test missing out parameter in single-artifact mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide a fake bpfcompat binary, artifact, and matrix so the action
      # reaches the out-path validation logic we want to test.
      - name: Install fake bpfcompat binary, artifact, and matrix
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat
          touch ./test-artifact.bpf.o
          cat > ./matrix.yaml << 'MATRIX'
          targets:
            - name: test-kernel
              kernel: "5.15"
          MATRIX

      - id: action
        uses: .
        continue-on-error: true
        with:
          # artifact and matrix are set but out is missing — should trigger validation error
          artifact: "test-artifact.bpf.o"
          matrix: "./matrix.yaml"
          # out intentionally omitted
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"

      - name: Assert action failed with missing out error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when out is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
