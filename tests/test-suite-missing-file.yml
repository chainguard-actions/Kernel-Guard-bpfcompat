name: Test suite mode with missing suite file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide a fake bpfcompat binary so the action gets past the binary-not-found
      # check and reaches the suite-file validation logic we want to test.
      - name: Install fake bpfcompat binary
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Suite file that does not exist — should trigger "suite file not found" error
          suite: "nonexistent-suite.yaml"
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"

      - name: Assert action failed with suite file not found error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when suite file does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
