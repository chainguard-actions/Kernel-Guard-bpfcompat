name: Test bpfcompat command construction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary, matrix, and artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # Fake binary that records its args and exits 0
          printf '#!/bin/sh\necho "ARGS: $*" > /tmp/bpfcompat-args.txt\necho "fake bpfcompat called with: $*"\nexit 0\n' \
            > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake .bpf.o artifact
          touch "$GITHUB_WORKSPACE/test.bpf.o"

          # Create a minimal matrix YAML
          mkdir -p "$GITHUB_WORKSPACE/matrices"
          printf 'targets: []\n' > "$GITHUB_WORKSPACE/matrices/test-matrix.yaml"

      - name: Run action with all required inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          artifact: "test.bpf.o"
          matrix: "matrices/test-matrix.yaml"
          out: "reports/out.json"
          timeout: "60s"
          concurrency: "1"

      - name: Assert bpfcompat was invoked with correct arguments
        run: |
          echo "Checking bpfcompat was called..."
          if [ ! -f /tmp/bpfcompat-args.txt ]; then
            echo "FAIL: bpfcompat was not called (args file not found)"
            exit 1
          fi
          ARGS="$(cat /tmp/bpfcompat-args.txt)"
          echo "args: $ARGS"

          # Verify 'test' subcommand was used
          if ! echo "$ARGS" | grep -q "test"; then
            echo "FAIL: expected 'test' subcommand in args"
            exit 1
          fi

          # Verify --artifact flag was passed
          if ! echo "$ARGS" | grep -q -- "--artifact"; then
            echo "FAIL: expected --artifact flag in args"
            exit 1
          fi

          # Verify --matrix flag was passed
          if ! echo "$ARGS" | grep -q -- "--matrix"; then
            echo "FAIL: expected --matrix flag in args"
            exit 1
          fi

          # Verify --out flag was passed
          if ! echo "$ARGS" | grep -q -- "--out"; then
            echo "FAIL: expected --out flag in args"
            exit 1
          fi

          # Verify --timeout flag was passed
          if ! echo "$ARGS" | grep -q -- "--timeout"; then
            echo "FAIL: expected --timeout flag in args"
            exit 1
          fi

          # Verify --concurrency flag was passed
          if ! echo "$ARGS" | grep -q -- "--concurrency"; then
            echo "FAIL: expected --concurrency flag in args"
            exit 1
          fi

          echo "PASS: bpfcompat was called with correct arguments"
