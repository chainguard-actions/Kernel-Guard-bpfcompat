name: Test binary not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no binary available (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "nonexistent/bin/bpfcompat"
          artifact: "some/artifact.bpf.o"
          matrix: "some/matrix.yaml"
          out: "some/report.json"

      - name: Assert action failed with binary not found error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when bpfcompat binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed when binary was not found"
