name: Test command-binary without command error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary, artifact, matrix, and command-binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat called with: $*"\nexit 0\n' \
            > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake loader binary
          printf '#!/bin/sh\necho "fake loader"\nexit 0\n' \
            > "$GITHUB_WORKSPACE/bin/my-loader"
          chmod +x "$GITHUB_WORKSPACE/bin/my-loader"

          # Create a fake .bpf.o artifact
          touch "$GITHUB_WORKSPACE/test.bpf.o"

          # Create a minimal matrix YAML
          mkdir -p "$GITHUB_WORKSPACE/matrices"
          printf 'targets: []\n' > "$GITHUB_WORKSPACE/matrices/test-matrix.yaml"

      - name: Run action (expect failure - command-binary without command)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          artifact: "test.bpf.o"
          command-binary: "bin/my-loader"
          matrix: "matrices/test-matrix.yaml"
          out: "reports/out.json"

      - name: Assert action failed with correct error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when command-binary is set without command"
            exit 1
          fi
          echo "PASS: action correctly failed when command-binary used without command"
