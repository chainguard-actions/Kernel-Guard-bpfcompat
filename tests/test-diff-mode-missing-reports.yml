name: Test diff mode with missing report files
on:
  workflow_dispatch:

jobs:
  test-diff-missing-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in diff mode with nonexistent report files (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          baseline-report: "nonexistent-baseline.json"
          candidate-report: "nonexistent-candidate.json"

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (binary not found or report files missing)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
