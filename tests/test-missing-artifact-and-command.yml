name: Test missing artifact and command error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake make and fake bpfcompat binary
        run: |
          printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/make
          chmod +x /usr/local/bin/make
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat: $*"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"
      - name: Run action expecting failure due to missing artifact and command
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          matrix: "dev-one"
          out: "/tmp/bpfcompat-report.json"
        continue-on-error: true
      - name: Assert action failed with missing artifact/command error
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact and command are both missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact and command were both missing"
