name: Test missing artifact and command error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

      - name: Create fake matrix file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/matrix.yaml" << 'EOF'
          targets: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          matrix: "tests/fixtures/matrix.yaml"
          out: "reports/test-out.json"
          # artifact and command are intentionally omitted

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact and command are both missing"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact and command are both missing"
