name: Test missing artifact and command inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies (stub)
        run: |
          # Create a fake bpfcompat binary so the build step is skipped
          # and we reach the input-validation logic
          mkdir -p "$GITHUB_ACTION_PATH/bin"
          cat > "$GITHUB_ACTION_PATH/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_ACTION_PATH/bin/bpfcompat"

      - id: action
        uses: .
        with:
          # No suite, no artifact, no command — should fail with a clear error
          build: "false"
          prebuilt: "never"
          matrix: "some-matrix"
          out: "/tmp/bpfcompat-out.json"
        continue-on-error: true

      - name: Assert action failed with missing artifact/command error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no artifact or command was provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
