name: Test missing required inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action gets past the binary check
      # and reaches the input validation logic
      - name: Create fake bpfcompat binary
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat

      - name: Run action without required inputs (expect failure)
        id: action
        uses: .
        with:
          build: "false"
          binary: "./bin/bpfcompat"
        continue-on-error: true

      - name: Assert action failed due to missing inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact, matrix, out, and suite are all missing"
            exit 1
          fi
          echo "PASS: action correctly failed when required inputs were missing"
