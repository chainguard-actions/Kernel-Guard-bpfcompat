name: Test missing required inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires artifact (or command) + matrix + out when suite is not set.
      # We set build=false and prebuilt=never so the binary-not-found check fires first.
      # We supply a fake binary so the action reaches the input-validation logic.
      - name: Create a fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat $@"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

      - name: Run action without required inputs (expect failure)
        id: action_no_inputs
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          # No artifact, no matrix, no out, no suite — should fail
        continue-on-error: true

      - name: Assert action failed due to missing inputs
        run: |
          echo "outcome: ${{ steps.action_no_inputs.outcome }}"
          if [ "${{ steps.action_no_inputs.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact/matrix/out are missing"
            exit 1
          fi
          echo "PASS: action correctly failed with missing required inputs"
