name: Test artifact file not found error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and matrix
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a matrix file but NOT the artifact
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'EOF'
          targets:
            - name: test-target
              kernel: "6.1"
          EOF

      - name: Run action with nonexistent artifact file (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "nonexistent.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/out.json"

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact file is not found"
