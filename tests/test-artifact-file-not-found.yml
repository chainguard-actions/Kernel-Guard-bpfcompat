name: Test artifact file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and matrix file
        run: |
          mkdir -p tests/fixtures/bin
          cat > tests/fixtures/bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x tests/fixtures/bin/bpfcompat

          mkdir -p tests/fixtures/matrices
          cat > tests/fixtures/matrices/test-matrix.yaml << 'EOF'
          targets: []
          EOF

      - name: Run action with missing artifact file (expecting failure)
        id: action
        uses: .
        with:
          build: "false"
          binary: "tests/fixtures/bin/bpfcompat"
          artifact: "tests/fixtures/nonexistent.bpf.o"
          matrix: "tests/fixtures/matrices/test-matrix.yaml"
          out: "tests/fixtures/reports/report.json"
        continue-on-error: true

      - name: Assert action failed due to artifact file not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact file was not found on disk"
