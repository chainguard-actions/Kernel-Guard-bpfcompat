name: Test missing binary error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent binary (expect failure)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/does-not-exist"
          artifact: "tests/fixtures/dummy.bpf.o"
          matrix: "tests/fixtures/matrix.yaml"
          out: "reports/out.json"
        continue-on-error: true

      - name: Assert action failed with missing binary error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed when binary was not found"
