name: Test missing binary error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake artifact and matrix to get past earlier checks
        run: |
          mkdir -p /tmp/bpfcompat-test
          touch /tmp/bpfcompat-test/prog.bpf.o
          cat > /tmp/bpfcompat-test/matrix.yaml <<'EOF'
          targets: []
          EOF
          mkdir -p /tmp/bpfcompat-test/reports

      - name: Run action expecting binary-not-found error
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "/nonexistent/path/bpfcompat"
          artifact: "/tmp/bpfcompat-test/prog.bpf.o"
          matrix: "/tmp/bpfcompat-test/matrix.yaml"
          out: "/tmp/bpfcompat-test/reports/out.json"

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when binary is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when binary not found"
