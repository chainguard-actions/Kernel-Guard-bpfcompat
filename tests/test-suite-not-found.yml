name: Test suite file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action reaches suite validation
      - name: Create a fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat $@"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

      - name: Run action with nonexistent suite file (expect failure)
        id: action_bad_suite
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          suite: "nonexistent-suite.yaml"
        continue-on-error: true

      - name: Assert action failed due to missing suite file
        run: |
          echo "outcome: ${{ steps.action_bad_suite.outcome }}"
          if [ "${{ steps.action_bad_suite.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when suite file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed with suite file not found"
