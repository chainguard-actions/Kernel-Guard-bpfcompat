name: Test basic invocation with fake binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary that exits 0
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          # Fake bpfcompat: print args and exit 0 for any subcommand
          echo "fake bpfcompat called with: $*"
          # For report-summary subcommand, just print nothing
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

      - name: Create fake artifact and matrix files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          touch "$GITHUB_WORKSPACE/tests/fixtures/test.bpf.o"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/matrix.yaml" << 'EOF'
          targets: []
          EOF

      - id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          artifact: "tests/fixtures/test.bpf.o"
          matrix: "tests/fixtures/matrix.yaml"
          out: "reports/test-out.json"

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with valid inputs and fake binary"
            exit 1
          fi
          echo "PASS: action succeeded with valid inputs and fake binary"
