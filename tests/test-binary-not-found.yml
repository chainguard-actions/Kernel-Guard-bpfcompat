name: Test binary not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Point to a binary that does not exist
          binary: "./bin/nonexistent-bpfcompat"
          build: "false"
          prebuilt: "never"
          artifact: "some-artifact.bpf.o"
          matrix: "some-matrix"
          out: "report.json"

      - name: Assert action failed with binary not found error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when bpfcompat binary is not found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
