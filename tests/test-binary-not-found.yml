name: Test binary not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake artifact file
      - name: Create fake artifact
        run: |
          touch ./my_prog.bpf.o

      # Create a fake matrix file
      - name: Create fake matrix file
        run: |
          cat > ./matrix.yaml << 'EOF'
          kernels:
            - version: "5.15"
          EOF

      - name: Run action expecting failure (binary not found)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/nonexistent-bpfcompat"
          artifact: "./my_prog.bpf.o"
          matrix: "./matrix.yaml"
          out: "report.json"
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when bpfcompat binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed when bpfcompat binary was not found"
