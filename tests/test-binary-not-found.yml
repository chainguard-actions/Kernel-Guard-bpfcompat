name: Test binary not found error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake artifact and matrix files
        run: |
          echo "fake bpf object" > "$GITHUB_WORKSPACE/test.bpf.o"
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'EOF'
          targets:
            - name: test-target
              kernel: "6.1"
          EOF

      - name: Run action with nonexistent binary (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/nonexistent-bpfcompat"
          artifact: "test.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/out.json"

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed when binary is not found"
