name: Test binary not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When build=false and prebuilt=never and no binary exists, the action
      # should fail with an error about the binary not being found.
      - name: Run action with no binary available (expect failure)
        id: action_no_binary
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat-does-not-exist"
          artifact: "some.bpf.o"
          matrix: "some-matrix.yaml"
          out: "reports/out.json"
        continue-on-error: true

      - name: Assert action failed due to missing binary
        run: |
          echo "outcome: ${{ steps.action_no_binary.outcome }}"
          if [ "${{ steps.action_no_binary.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when bpfcompat binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed with binary not found"
