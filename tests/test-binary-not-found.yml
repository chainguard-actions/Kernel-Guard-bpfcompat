name: Test binary not found
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          # binary defaults to ./bin/bpfcompat which does not exist
          # No suite, no artifact — but binary check happens first
          artifact: "dummy.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/out.json"

      - name: Assert action failed because binary was not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when bpfcompat binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed when binary is not found"
