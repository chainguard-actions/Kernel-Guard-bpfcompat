name: Test suite file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary
        run: |
          mkdir -p tests/fixtures/bin
          cat > tests/fixtures/bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x tests/fixtures/bin/bpfcompat

      - name: Run action in suite mode with missing suite file (expecting failure)
        id: action
        uses: .
        with:
          build: "false"
          binary: "tests/fixtures/bin/bpfcompat"
          suite: "tests/fixtures/nonexistent-suite.yaml"
        continue-on-error: true

      - name: Assert action failed due to missing suite file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when suite file is not found, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when suite file was not found"
