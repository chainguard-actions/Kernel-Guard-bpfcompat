name: Test suite file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action gets past the binary check
      - name: Create fake bpfcompat binary
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          binary: "./bin/bpfcompat"
          suite: "nonexistent-suite.yaml"

      - name: Assert action failed due to missing suite file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when suite file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when suite file was missing"
