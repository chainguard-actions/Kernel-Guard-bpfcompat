name: Test missing matrix error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action reaches matrix validation
      - name: Create a fake bpfcompat binary and artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat $@"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake .bpf.o artifact file
          echo "fake bpf object" > /tmp/test.bpf.o

      - name: Run action with artifact and out but no matrix (expect failure)
        id: action_no_matrix
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "/tmp/test.bpf.o"
          out: "reports/test-out.json"
          # No matrix set — should fail with "matrix is required"
        continue-on-error: true

      - name: Assert action failed due to missing matrix
        run: |
          echo "outcome: ${{ steps.action_no_matrix.outcome }}"
          if [ "${{ steps.action_no_matrix.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when matrix is not set"
            exit 1
          fi
          echo "PASS: action correctly failed with matrix is required"
