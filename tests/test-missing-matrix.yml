name: Test missing matrix input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and fake artifact
        run: |
          # Create a fake bpfcompat binary so we reach input-validation logic
          mkdir -p "$GITHUB_ACTION_PATH/bin"
          cat > "$GITHUB_ACTION_PATH/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_ACTION_PATH/bin/bpfcompat"

          # Create a fake .bpf.o artifact
          echo "fake bpf object" > /tmp/test.bpf.o

      - id: action
        uses: .
        with:
          # artifact is set but matrix is not — should fail with a clear error
          artifact: "/tmp/test.bpf.o"
          build: "false"
          prebuilt: "never"
          out: "/tmp/bpfcompat-out.json"
          # matrix intentionally omitted
        continue-on-error: true

      - name: Assert action failed with missing matrix error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when matrix was not provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
