name: Test missing matrix in single-artifact mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide a fake bpfcompat binary and a fake artifact so the action
      # reaches the matrix-validation logic we want to test.
      - name: Install fake bpfcompat binary and artifact
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat
          # Create a fake .bpf.o artifact file
          touch ./test-artifact.bpf.o

      - id: action
        uses: .
        continue-on-error: true
        with:
          # artifact is set but matrix is missing — should trigger validation error
          artifact: "test-artifact.bpf.o"
          out: "report.json"
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          # matrix intentionally omitted

      - name: Assert action failed with missing matrix error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when matrix is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
