name: Test missing matrix error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and artifact
        run: |
          mkdir -p tests/fixtures/bin
          cat > tests/fixtures/bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x tests/fixtures/bin/bpfcompat

          mkdir -p tests/fixtures/artifacts
          echo "fake eBPF object" > tests/fixtures/artifacts/test.bpf.o

      - name: Run action without matrix (expecting failure)
        id: action
        uses: .
        with:
          build: "false"
          binary: "tests/fixtures/bin/bpfcompat"
          artifact: "tests/fixtures/artifacts/test.bpf.o"
          # matrix intentionally omitted — should trigger error
          out: "tests/fixtures/reports/report.json"
        continue-on-error: true

      - name: Assert action failed due to missing matrix input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when matrix is not provided, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when matrix input was missing"
