name: Test missing matrix error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action gets past the binary check
      - name: Create fake bpfcompat binary
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat

      # Create a fake artifact file
      - name: Create fake artifact
        run: |
          touch ./my_prog.bpf.o

      - name: Run action expecting failure (no matrix)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "./my_prog.bpf.o"
          out: "report.json"
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when matrix is not provided"
            exit 1
          fi
          echo "PASS: action correctly failed when matrix was not provided"
