name: Test command-binary requires command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Place a fake bpfcompat binary so the action reaches input validation
      - name: Install fake bpfcompat binary
        run: |
          mkdir -p bin
          cat > bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat: $*"
          exit 0
          EOF
          chmod +x bin/bpfcompat

      # Create a dummy loader binary
      - name: Create dummy loader binary
        run: |
          mkdir -p loaders
          cat > loaders/my-loader << 'EOF'
          #!/bin/sh
          echo "fake loader"
          exit 0
          EOF
          chmod +x loaders/my-loader

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          command-binary: "loaders/my-loader"
          # No command — should fail with "command-binary requires command"
          matrix: "dev-one"
          out: "reports/out.json"

      - name: Assert action failed with command-binary requires command error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when command-binary is set without command"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
