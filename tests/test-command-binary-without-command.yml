name: Test command-binary without command error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake make, fake bpfcompat binary, and fake loader binary
        run: |
          printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/make
          chmod +x /usr/local/bin/make
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat: $*"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"
          printf '#!/bin/sh\necho "fake loader"\nexit 0\n' > /tmp/fake-loader
          chmod +x /tmp/fake-loader
          touch /tmp/test.bpf.o
      - name: Run action expecting failure because command-binary requires command
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          artifact: "/tmp/test.bpf.o"
          command-binary: "/tmp/fake-loader"
          matrix: "dev-one"
          out: "/tmp/bpfcompat-report.json"
        continue-on-error: true
      - name: Assert action failed because command-binary requires command
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when command-binary is set without command, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when command-binary was set without command"
