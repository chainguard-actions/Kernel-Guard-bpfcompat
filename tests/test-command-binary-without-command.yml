name: Test command-binary without command error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action gets past the binary check
      - name: Create fake bpfcompat binary
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat

      # Create a fake loader binary
      - name: Create fake loader binary
        run: |
          cat > ./my-loader << 'EOF'
          #!/bin/bash
          echo "fake loader"
          exit 0
          EOF
          chmod +x ./my-loader

      # Create a fake matrix file
      - name: Create fake matrix file
        run: |
          cat > ./matrix.yaml << 'EOF'
          kernels:
            - version: "5.15"
          EOF

      - name: Run action expecting failure (command-binary without command)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          command-binary: "./my-loader"
          matrix: "./matrix.yaml"
          out: "report.json"
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when command-binary is set without command"
            exit 1
          fi
          echo "PASS: action correctly failed when command-binary was provided without command"
