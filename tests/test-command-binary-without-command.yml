name: Test command-binary without command
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake binary, command-binary, and matrix files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"
          # Create a dummy loader binary
          cat > "$GITHUB_WORKSPACE/bin/my-loader" << 'EOF'
          #!/bin/sh
          echo "fake loader"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/my-loader"
          # Create a minimal matrix YAML
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'YAML'
          targets:
            - name: linux-5.15
              kernel: "5.15"
          YAML
          mkdir -p "$GITHUB_WORKSPACE/reports"

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          command-binary: "bin/my-loader"
          # No command set — should fail with "command-binary requires command"
          matrix: "matrix.yaml"
          out: "reports/out.json"

      - name: Assert action failed because command-binary requires command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when command-binary is set without command"
            exit 1
          fi
          echo "PASS: action correctly failed when command-binary is set without command"
