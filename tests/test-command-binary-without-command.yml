name: Test command-binary without command error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary, artifact, matrix, and a loader binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" <<'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake loader binary
          cat > /tmp/my-loader <<'EOF'
          #!/bin/sh
          echo "loader called"
          exit 0
          EOF
          chmod +x /tmp/my-loader

          # Create a minimal artifact and matrix
          touch /tmp/prog.bpf.o
          cat > /tmp/matrix.yaml <<'EOF'
          targets: []
          EOF
          mkdir -p /tmp/bpfcompat-reports

      - name: Run action with command-binary but no command
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "/tmp/prog.bpf.o"
          matrix: "/tmp/matrix.yaml"
          out: "/tmp/bpfcompat-reports/out.json"
          command-binary: "/tmp/my-loader"
          # No command — should fail with "command-binary requires command" error

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when command-binary is set without command, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when command-binary was set without command"
