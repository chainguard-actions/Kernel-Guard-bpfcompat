name: Test command-binary requires command error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action reaches input validation
      - name: Create fake binaries and files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"

          printf '#!/bin/sh\necho "fake bpfcompat $@"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake command-binary file
          printf '#!/bin/sh\necho "fake loader"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/fake-loader"
          chmod +x "$GITHUB_WORKSPACE/bin/fake-loader"

          # Create a fake .bpf.o artifact file
          echo "fake bpf object" > /tmp/test.bpf.o

          # Create a minimal matrix file
          cat > /tmp/test-matrix.yaml << 'EOF'
          name: test
          profiles:
            - id: ubuntu-22.04-5.15
              required: true
          EOF

      - name: Run action with command-binary but no command (expect failure)
        id: action_binary_no_cmd
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "/tmp/test.bpf.o"
          command-binary: "./bin/fake-loader"
          # No command set — should fail with "command-binary requires command"
          matrix: "/tmp/test-matrix.yaml"
          out: "reports/test-out.json"
        continue-on-error: true

      - name: Assert action failed due to command-binary without command
        run: |
          echo "outcome: ${{ steps.action_binary_no_cmd.outcome }}"
          if [ "${{ steps.action_binary_no_cmd.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when command-binary is set without command"
            exit 1
          fi
          echo "PASS: action correctly failed with command-binary requires command"
