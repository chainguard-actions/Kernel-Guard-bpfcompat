name: Test command-binary without command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Place a fake bpfcompat binary so the action doesn't fail on binary-not-found
      # before reaching the command-binary validation check.
      - name: Create fake bpfcompat binary and loader
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake loader binary for command-binary input
          cat > "$GITHUB_WORKSPACE/bin/my-loader" << 'EOF'
          #!/bin/sh
          echo "fake loader"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/my-loader"

      - name: Run action (expect failure - command-binary without command)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          command-binary: "./bin/my-loader"
          matrix: "tests/fixtures/minimal-matrix.yaml"
          out: "/tmp/bpfcompat-out.json"
          # No command set — should fail because command-binary requires command
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when command-binary is set without command"
            exit 1
          fi
          echo "PASS: action correctly failed when command-binary was set without command"
