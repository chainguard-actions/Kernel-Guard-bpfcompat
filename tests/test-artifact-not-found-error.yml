name: Test artifact not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fake-bin"
          cat > "$GITHUB_WORKSPACE/fake-bin/bpfcompat" << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/fake-bin/bpfcompat"

      - name: Create fake matrix file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-inputs"
          cat > "$GITHUB_WORKSPACE/test-inputs/matrix.yaml" << 'EOF'
          targets:
            - name: test-target
              kernel: "6.1"
          EOF

      - name: Run action with nonexistent artifact (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "fake-bin/bpfcompat"
          artifact: "nonexistent/path/to/artifact.bpf.o"
          matrix: "test-inputs/matrix.yaml"
          out: "test-outputs/report.json"

      - name: Assert action failed with artifact not found error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact file was not found"
