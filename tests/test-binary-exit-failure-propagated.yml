name: Test binary exit failure is propagated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary that exits with failure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # This fake binary simulates a compatibility failure (exit 1)
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat: compatibility check failed"
          exit 1
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a dummy artifact file
          echo "dummy bpf object" > "$GITHUB_WORKSPACE/dummy.bpf.o"

          # Create a dummy matrix file
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'YAML'
          targets:
            - kernel: "6.1"
          YAML

      - name: Run action where bpfcompat binary exits with failure
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "dummy.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/bpfcompat-out.json"
        continue-on-error: true

      - name: Assert action failed because binary exited with failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when bpfcompat binary exits with non-zero status"
            exit 1
          fi
          echo "PASS: action correctly propagated binary exit failure"
