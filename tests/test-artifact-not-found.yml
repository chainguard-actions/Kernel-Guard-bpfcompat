name: Test artifact file not found
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake binary and matrix but NOT the artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"
          # Create a minimal matrix YAML
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'YAML'
          targets:
            - name: linux-5.15
              kernel: "5.15"
          YAML
          mkdir -p "$GITHUB_WORKSPACE/reports"

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          artifact: "missing-artifact.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/out.json"
          # artifact file does not exist — should fail with "artifact not found"

      - name: Assert action failed with artifact not found error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact is not found"
