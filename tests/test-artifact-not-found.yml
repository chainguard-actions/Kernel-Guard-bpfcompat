name: Test artifact file not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide a fake bpfcompat binary and a fake matrix file so the action
      # reaches the artifact-existence check we want to test.
      - name: Install fake bpfcompat binary and matrix
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat
          # Create a fake matrix file
          cat > ./matrix.yaml << 'MATRIX'
          targets:
            - name: test-kernel
              kernel: "5.15"
          MATRIX

      - id: action
        uses: .
        continue-on-error: true
        with:
          # artifact path that does not exist — should trigger "artifact not found" error
          artifact: "nonexistent-artifact.bpf.o"
          matrix: "./matrix.yaml"
          out: "report.json"
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"

      - name: Assert action failed with artifact not found error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when artifact file does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
