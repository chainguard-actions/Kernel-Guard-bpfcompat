name: Test artifact not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action reaches artifact validation
      - name: Create a fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat $@"\nexit 0\n' > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

      # Create a minimal matrix file so only the artifact check fails
      - name: Create a minimal matrix file
        run: |
          cat > /tmp/test-matrix.yaml << 'EOF'
          name: test
          profiles:
            - id: ubuntu-22.04-5.15
              required: true
          EOF

      - name: Run action with nonexistent artifact (expect failure)
        id: action_bad_artifact
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "nonexistent.bpf.o"
          matrix: "/tmp/test-matrix.yaml"
          out: "reports/test-out.json"
        continue-on-error: true

      - name: Assert action failed due to missing artifact
        run: |
          echo "outcome: ${{ steps.action_bad_artifact.outcome }}"
          if [ "${{ steps.action_bad_artifact.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed with artifact not found"
