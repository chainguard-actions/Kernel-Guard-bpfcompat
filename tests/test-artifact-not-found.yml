name: Test artifact file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" <<'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a real matrix file but NOT the artifact
          mkdir -p "$GITHUB_WORKSPACE/test-artifacts"
          cat > "$GITHUB_WORKSPACE/test-artifacts/matrix.yaml" <<'YAML'
          targets:
            - kernel: "6.1"
              arch: x86_64
          YAML

      - name: Run action with non-existent artifact file
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "test-artifacts/nonexistent.bpf.o"
          matrix: "test-artifacts/matrix.yaml"
          out: "test-artifacts/report.json"

      - name: Assert action failed due to missing artifact file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact file was not found"
