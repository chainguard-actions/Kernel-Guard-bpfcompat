name: Test artifact file not found error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and fake matrix
        run: |
          # Create a fake bpfcompat binary so we reach artifact validation
          mkdir -p "$GITHUB_ACTION_PATH/bin"
          cat > "$GITHUB_ACTION_PATH/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_ACTION_PATH/bin/bpfcompat"

          # Create a fake matrix YAML
          cat > /tmp/test-matrix.yaml << 'YAML'
          kernels:
            - name: test-kernel
              image: fake-image:latest
          YAML

      - id: action
        uses: .
        with:
          # artifact points to a non-existent local file — should fail with a clear error
          artifact: "/tmp/nonexistent-artifact.bpf.o"
          matrix: "/tmp/test-matrix.yaml"
          out: "/tmp/bpfcompat-out.json"
          build: "false"
          prebuilt: "never"
        continue-on-error: true

      - name: Assert action failed with artifact not found error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when artifact file was not found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
