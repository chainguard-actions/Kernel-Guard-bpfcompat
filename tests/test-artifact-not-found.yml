name: Test artifact file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake bpfcompat binary so the action gets past the binary check
      - name: Create fake bpfcompat binary
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat

      # Create a real matrix file but NOT the artifact file
      - name: Create matrix file
        run: |
          cat > /tmp/matrix.yaml << 'EOF'
          targets:
            - name: ubuntu-22.04
              kernel: "5.15"
          EOF

      - name: Run action with missing artifact file (expect failure)
        id: action
        uses: .
        with:
          build: "false"
          binary: "./bin/bpfcompat"
          artifact: "nonexistent.bpf.o"
          matrix: "/tmp/matrix.yaml"
          out: "/tmp/report.json"
        continue-on-error: true

      - name: Assert action failed due to missing artifact
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact file was not found"
