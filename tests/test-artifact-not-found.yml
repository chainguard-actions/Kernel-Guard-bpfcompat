name: Test artifact file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary
        run: |
          mkdir -p bin
          cat > bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x bin/bpfcompat

      - name: Run action expecting failure (artifact file does not exist)
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "nonexistent.bpf.o"
          matrix: "dev-one"
          out: "/tmp/bpfcompat-out.json"
        continue-on-error: true

      - name: Assert action failed due to artifact not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact file does not exist, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact file was not found"
