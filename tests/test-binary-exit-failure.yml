name: Test binary exit failure propagation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary that exits with failure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # Fake bpfcompat that simulates a compatibility failure (exit 1)
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'BPFEOF'
          #!/bin/sh
          echo "fake bpfcompat: simulating compatibility failure"
          # Still create the output file so the action can write the summary
          prev=""
          for arg in "$@"; do
            if [ "$prev" = "--out" ]; then
              mkdir -p "$(dirname "$arg")"
              echo '{"status":"fail","targets":[{"name":"test-target","status":"fail"}]}' > "$arg"
            fi
            prev="$arg"
          done
          exit 1
          BPFEOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake .bpf.o artifact
          echo "fake bpf object" > "$GITHUB_WORKSPACE/test.bpf.o"

          # Create a minimal matrix YAML
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'EOF'
          targets:
            - name: test-target
              kernel: "6.1"
          EOF

      - name: Run action where binary reports failure
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "test.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/out.json"
          timeout: "30s"
          concurrency: "1"

      - name: Assert action failed when binary exits non-zero
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when bpfcompat binary exits non-zero"
            exit 1
          fi
          echo "PASS: action correctly propagated binary failure exit code"
