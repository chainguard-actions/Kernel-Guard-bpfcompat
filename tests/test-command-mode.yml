name: Test command mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and matrix
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # Fake binary that records its args and exits 0
          printf '#!/bin/sh\necho "ARGS: $*" > /tmp/bpfcompat-cmd-args.txt\necho "fake bpfcompat called with: $*"\nexit 0\n' \
            > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a minimal matrix YAML
          mkdir -p "$GITHUB_WORKSPACE/matrices"
          printf 'targets: []\n' > "$GITHUB_WORKSPACE/matrices/test-matrix.yaml"

      - name: Run action in command mode
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          command: "echo hello"
          matrix: "matrices/test-matrix.yaml"
          out: "reports/out.json"
          timeout: "60s"
          concurrency: "1"

      - name: Assert bpfcompat was invoked in command mode
        run: |
          echo "Checking bpfcompat was called in command mode..."
          if [ ! -f /tmp/bpfcompat-cmd-args.txt ]; then
            echo "FAIL: bpfcompat was not called (args file not found)"
            exit 1
          fi
          ARGS="$(cat /tmp/bpfcompat-cmd-args.txt)"
          echo "args: $ARGS"

          # Verify 'test' subcommand was used
          if ! echo "$ARGS" | grep -q "test"; then
            echo "FAIL: expected 'test' subcommand in args"
            exit 1
          fi

          # Verify --command flag was passed
          if ! echo "$ARGS" | grep -q -- "--command"; then
            echo "FAIL: expected --command flag in args"
            exit 1
          fi

          # Verify --matrix flag was passed
          if ! echo "$ARGS" | grep -q -- "--matrix"; then
            echo "FAIL: expected --matrix flag in args"
            exit 1
          fi

          echo "PASS: bpfcompat was called in command mode with correct arguments"
