name: Test single artifact mode success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary, artifact, and matrix files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # Fake binary that records its arguments and exits successfully
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          # Write a fake JSON report so the action doesn't complain
          if [[ "$1" == "test" ]]; then
            for i in "$@"; do
              if [[ "$prev" == "--out" ]]; then
                mkdir -p "$(dirname "$i")"
                echo '{"targets":[]}' > "$i"
              fi
              prev="$i"
            done
          fi
          # Stub out report-summary subcommand
          if [[ "$1" == "report-summary" ]]; then
            echo "# bpfcompat Compatibility Gate"
            echo "No failures."
          fi
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a fake .bpf.o artifact (just needs to exist as a file)
          touch "$GITHUB_WORKSPACE/example.bpf.o"

          # Create a minimal matrix YAML file
          cat > "$GITHUB_WORKSPACE/matrix.yaml" << 'MATRIX'
          targets:
            - kernel: "6.1"
              arch: x86_64
          MATRIX

      - name: Run action in single-artifact mode (expect success)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          artifact: "example.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/out.json"
          markdown: "reports/out.md"
          timeout: "60s"
          concurrency: "1"

      - name: Assert action succeeded in single-artifact mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed in single-artifact mode with valid inputs"
            exit 1
          fi
          echo "PASS: action correctly succeeded in single-artifact mode"

      - name: Assert report output was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/reports/out.json" ]; then
            echo "FAIL: expected report output file reports/out.json to exist"
            exit 1
          fi
          echo "PASS: report output file exists"
          cat "$GITHUB_WORKSPACE/reports/out.json"
