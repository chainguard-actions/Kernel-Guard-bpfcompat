name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide a fake bpfcompat binary so the action gets past the binary-not-found
      # check and reaches the input-validation logic we want to test.
      - name: Install fake bpfcompat binary
        run: |
          mkdir -p ./bin
          cat > ./bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat: $*"
          exit 0
          EOF
          chmod +x ./bin/bpfcompat

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No artifact, no command, no suite — should trigger validation error
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          matrix: "some-matrix"
          out: "report.json"

      - name: Assert action failed with missing artifact/command error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when artifact and command are both missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
