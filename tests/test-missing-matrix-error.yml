name: Test missing matrix error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          printf '#!/bin/sh\necho "fake bpfcompat called with: $*"\nexit 0\n' \
            > "$GITHUB_WORKSPACE/bin/bpfcompat"
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"
          # Create a fake .bpf.o artifact
          touch "$GITHUB_WORKSPACE/test.bpf.o"

      - name: Run action (expect failure - no matrix)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/bpfcompat"
          artifact: "test.bpf.o"
          out: "reports/out.json"

      - name: Assert action failed with correct error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when matrix is missing"
            exit 1
          fi
          echo "PASS: action correctly failed due to missing matrix"
