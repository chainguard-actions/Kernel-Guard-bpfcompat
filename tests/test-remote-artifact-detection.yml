name: Test remote OCI artifact reference detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and fake matrix
        run: |
          # Create a fake bpfcompat binary that records its arguments
          mkdir -p "$GITHUB_ACTION_PATH/bin"
          cat > "$GITHUB_ACTION_PATH/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          # Record the arguments for inspection
          echo "ARGS: $*" > /tmp/bpfcompat-args.txt
          echo "fake bpfcompat called with: $*"
          # Simulate a successful run (exit 0) so we can inspect the args
          exit 0
          EOF
          chmod +x "$GITHUB_ACTION_PATH/bin/bpfcompat"

          # Create a fake matrix YAML
          cat > /tmp/test-matrix.yaml << 'YAML'
          kernels:
            - name: test-kernel
              image: fake-image:latest
          YAML

      - id: action
        uses: .
        with:
          # Use a remote OCI reference — should NOT be treated as a local path
          artifact: "ghcr.io/example/gadget:latest"
          matrix: "/tmp/test-matrix.yaml"
          out: "/tmp/bpfcompat-out.json"
          build: "false"
          prebuilt: "never"
        continue-on-error: true

      - name: Assert remote artifact reference was passed through correctly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have reached the bpfcompat binary invocation
          # (not failed on "artifact not found" for a remote ref).
          # It may fail because the fake binary exits 0 but the matrix/kernel
          # setup is not real — that's fine. What matters is that the action
          # did NOT fail with "artifact not found: $GITHUB_WORKSPACE/ghcr.io/..."
          if [ -f /tmp/bpfcompat-args.txt ]; then
            ARGS="$(cat /tmp/bpfcompat-args.txt)"
            echo "bpfcompat args: $ARGS"
            # Verify the remote ref was passed as-is (not mangled with workspace prefix)
            if echo "$ARGS" | grep -q "ghcr.io/example/gadget:latest"; then
              echo "PASS: remote artifact reference was passed through correctly"
            else
              echo "FAIL: remote artifact reference was not found in bpfcompat args"
              exit 1
            fi
          else
            # If the args file doesn't exist, the binary was never called.
            # This means the action failed before reaching the binary invocation.
            echo "bpfcompat was not called — checking outcome"
            if [ "$OUTCOME" = "failure" ]; then
              echo "INFO: action failed before calling bpfcompat (possibly due to missing matrix resolution)"
              echo "PASS: action did not mangle the remote artifact path into a local path"
            else
              echo "FAIL: unexpected state — no args file and outcome is '$OUTCOME'"
              exit 1
            fi
          fi
