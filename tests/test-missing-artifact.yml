name: Test missing artifact error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary
        run: |
          mkdir -p tests/fixtures/bin
          cat > tests/fixtures/bin/bpfcompat << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x tests/fixtures/bin/bpfcompat

      - name: Run action without artifact (expecting failure)
        id: action
        uses: .
        with:
          build: "false"
          binary: "tests/fixtures/bin/bpfcompat"
          # artifact intentionally omitted — should trigger error
          matrix: "matrix.yaml"
          out: "report.json"
        continue-on-error: true

      - name: Assert action failed due to missing artifact input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact is not provided, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact input was missing"
