name: Test missing artifact error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" << 'EOF'
          #!/bin/sh
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

      - name: Run action without artifact (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          # No artifact, matrix, out, or suite — should fail

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact is missing"
