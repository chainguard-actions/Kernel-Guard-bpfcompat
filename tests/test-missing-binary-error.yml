name: Test missing binary error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake artifact and matrix
        run: |
          touch "$GITHUB_WORKSPACE/test.bpf.o"
          mkdir -p "$GITHUB_WORKSPACE/matrices"
          printf 'targets: []\n' > "$GITHUB_WORKSPACE/matrices/test-matrix.yaml"

      - name: Run action (expect failure - binary not found)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "bin/nonexistent-bpfcompat"
          artifact: "test.bpf.o"
          matrix: "matrices/test-matrix.yaml"
          out: "reports/out.json"

      - name: Assert action failed with correct error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed due to missing binary"
