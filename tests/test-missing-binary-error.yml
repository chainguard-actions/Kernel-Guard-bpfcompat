name: Test missing binary error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          binary: "./bin/bpfcompat-nonexistent"
          artifact: "some-artifact.bpf.o"
          matrix: "matrix.yaml"
          out: "reports/out.json"

      - name: Assert action failed due to missing binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when binary is not found"
            exit 1
          fi
          echo "PASS: action correctly failed when binary was missing"
