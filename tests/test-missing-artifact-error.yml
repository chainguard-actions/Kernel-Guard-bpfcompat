name: Test missing artifact error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fake-bin"
          cat > "$GITHUB_WORKSPACE/fake-bin/bpfcompat" << 'EOF'
          #!/bin/bash
          echo "fake bpfcompat called with: $*"
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/fake-bin/bpfcompat"

      - name: Run action without artifact or suite (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          build: "false"
          prebuilt: "never"
          binary: "fake-bin/bpfcompat"

      - name: Assert action failed with missing artifact error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact, matrix, and out are not provided"
            exit 1
          fi
          echo "PASS: action correctly failed when required inputs were missing"
