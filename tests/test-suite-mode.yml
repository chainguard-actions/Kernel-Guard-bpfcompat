name: Test suite mode success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and suite file
        run: |
          mkdir -p tests/fixtures/bin
          cat > tests/fixtures/bin/bpfcompat << 'EOF'
          #!/bin/sh
          # Fake bpfcompat: record args and exit 0
          echo "fake bpfcompat called with: $*"
          # If called as 'suite', create the output files if --out is given
          out_file=""
          markdown_file=""
          prev=""
          for arg in "$@"; do
            if [ "$prev" = "--out" ]; then
              out_file="$arg"
            fi
            if [ "$prev" = "--markdown" ]; then
              markdown_file="$arg"
            fi
            prev="$arg"
          done
          if [ -n "$out_file" ]; then
            mkdir -p "$(dirname "$out_file")"
            echo '{"status":"pass","suites":[]}' > "$out_file"
          fi
          if [ -n "$markdown_file" ]; then
            mkdir -p "$(dirname "$markdown_file")"
            echo "# bpfcompat Suite Results" > "$markdown_file"
            echo "All suites passed." >> "$markdown_file"
          fi
          exit 0
          EOF
          chmod +x tests/fixtures/bin/bpfcompat

          # Create a minimal suite YAML
          mkdir -p tests/fixtures/suites
          cat > tests/fixtures/suites/test-suite.yaml << 'EOF'
          suites: []
          EOF

          # Ensure output directories exist
          mkdir -p tests/fixtures/reports

      - name: Run action in suite mode
        id: action
        uses: .
        with:
          build: "false"
          binary: "tests/fixtures/bin/bpfcompat"
          suite: "tests/fixtures/suites/test-suite.yaml"
          suite-out: "tests/fixtures/reports/suite-report.json"
          suite-markdown: "tests/fixtures/reports/suite-report.md"
          timeout: "30s"
          concurrency: "1"

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed in suite mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action succeeded in suite mode"

      - name: Assert suite report file was created
        run: |
          if [ ! -f "tests/fixtures/reports/suite-report.json" ]; then
            echo "FAIL: expected suite report file at tests/fixtures/reports/suite-report.json"
            exit 1
          fi
          echo "PASS: suite report file exists"
          cat tests/fixtures/reports/suite-report.json
