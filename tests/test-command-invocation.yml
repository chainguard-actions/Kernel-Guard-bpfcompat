name: Test bpfcompat binary invocation with correct arguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary that records its arguments
        run: |
          mkdir -p bin
          cat > bin/bpfcompat << 'EOF'
          #!/bin/sh
          # Record all arguments to a file for later inspection
          echo "$*" > /tmp/bpfcompat-args.txt
          echo "fake bpfcompat called with: $*"
          # Exit 0 to simulate success
          exit 0
          EOF
          chmod +x bin/bpfcompat
          # Create a fake .bpf.o artifact
          touch /tmp/test.bpf.o

      - name: Run action with all required single-artifact inputs
        id: action
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "/tmp/test.bpf.o"
          matrix: "dev-one"
          out: "/tmp/bpfcompat-out.json"
          timeout: "60s"
          concurrency: "1"
        continue-on-error: true

      - name: Assert binary was invoked with expected arguments
        run: |
          if [ ! -f /tmp/bpfcompat-args.txt ]; then
            echo "FAIL: bpfcompat was never called (args file not found)"
            exit 1
          fi
          ARGS="$(cat /tmp/bpfcompat-args.txt)"
          echo "bpfcompat args: $ARGS"

          # Verify the 'test' subcommand was used
          if ! echo "$ARGS" | grep -q "test"; then
            echo "FAIL: expected 'test' subcommand in args: $ARGS"
            exit 1
          fi

          # Verify --artifact flag was passed
          if ! echo "$ARGS" | grep -q "\-\-artifact"; then
            echo "FAIL: expected --artifact flag in args: $ARGS"
            exit 1
          fi

          # Verify --matrix flag was passed
          if ! echo "$ARGS" | grep -q "\-\-matrix"; then
            echo "FAIL: expected --matrix flag in args: $ARGS"
            exit 1
          fi

          # Verify --out flag was passed
          if ! echo "$ARGS" | grep -q "\-\-out"; then
            echo "FAIL: expected --out flag in args: $ARGS"
            exit 1
          fi

          # Verify --timeout flag was passed
          if ! echo "$ARGS" | grep -q "\-\-timeout"; then
            echo "FAIL: expected --timeout flag in args: $ARGS"
            exit 1
          fi

          # Verify --concurrency flag was passed
          if ! echo "$ARGS" | grep -q "\-\-concurrency"; then
            echo "FAIL: expected --concurrency flag in args: $ARGS"
            exit 1
          fi

          echo "PASS: bpfcompat was invoked with all expected arguments"
