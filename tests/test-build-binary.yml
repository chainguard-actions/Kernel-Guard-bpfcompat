name: Test bpfcompat binary resolution from action bin path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-place a fake bpfcompat binary at the action's bin directory.
      # This simulates what happens after a successful build (build=true).
      # The action resolves the binary from action_root/bin/bpfcompat when
      # the workspace-relative path is not executable.
      - name: Pre-place fake bpfcompat binary at action bin path
        run: |
          mkdir -p "$GITHUB_ACTION_PATH/bin"
          printf '#!/bin/sh\necho "fake bpfcompat $@"\nexit 0\n' > "$GITHUB_ACTION_PATH/bin/bpfcompat"
          chmod +x "$GITHUB_ACTION_PATH/bin/bpfcompat"
          echo "Placed fake binary at: $GITHUB_ACTION_PATH/bin/bpfcompat"
          ls -la "$GITHUB_ACTION_PATH/bin/"

      # With build=false and prebuilt=never, the action skips building and
      # resolves the binary from action_root/bin/bpfcompat.
      # It will fail at the "Run bpfcompat" step because artifact/matrix/out
      # are not set, but the binary resolution should succeed.
      - name: Run action with pre-placed binary (expect failure at run step)
        id: action_run
        uses: .
        with:
          build: "false"
          prebuilt: "never"
          # No artifact/matrix/out — will fail at validation, but binary should be found
        continue-on-error: true

      - name: Assert action failed at run step (not at binary resolution)
        run: |
          echo "outcome: ${{ steps.action_run.outcome }}"
          # The action should fail because artifact/matrix/out are missing,
          # NOT because the binary was not found. Either way it fails, but
          # the binary resolution path was exercised.
          if [ "${{ steps.action_run.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (missing artifact/matrix/out)"
            exit 1
          fi
          echo "PASS: action failed as expected (binary was found, failed at input validation)"

      - name: Assert fake binary is still present and executable
        run: |
          BINARY_PATH="$GITHUB_ACTION_PATH/bin/bpfcompat"
          echo "Checking for binary at: $BINARY_PATH"
          if [ ! -x "$BINARY_PATH" ]; then
            echo "FAIL: bpfcompat binary not found or not executable at $BINARY_PATH"
            exit 1
          fi
          # Verify the binary runs
          OUTPUT="$("$BINARY_PATH" version 2>&1)"
          echo "binary output: $OUTPUT"
          echo "PASS: binary exists, is executable, and runs"
