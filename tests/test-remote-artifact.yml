name: Test remote OCI artifact reference
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake bpfcompat binary and matrix
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # Fake bpfcompat that verifies --artifact is passed with the OCI ref
          cat > "$GITHUB_WORKSPACE/bin/bpfcompat" <<'EOF'
          #!/bin/sh
          echo "bpfcompat invoked with args: $*"
          # Verify --artifact flag is present with the OCI reference
          found_artifact=0
          prev=""
          for arg in "$@"; do
            if [ "$prev" = "--artifact" ]; then
              # Should be the OCI ref, not a mangled local path
              case "$arg" in
                ghcr.io/*)
                  found_artifact=1
                  echo "Artifact arg is OCI ref: $arg"
                  ;;
                *)
                  echo "ERROR: artifact arg was mangled: $arg"
                  exit 1
                  ;;
              esac
            fi
            prev="$arg"
          done
          if [ "$found_artifact" = "0" ]; then
            echo "ERROR: --artifact flag not found in args"
            exit 1
          fi
          # Write a minimal JSON report to --out path
          out=""
          prev=""
          for arg in "$@"; do
            if [ "$prev" = "--out" ]; then
              out="$arg"
            fi
            prev="$arg"
          done
          if [ -n "$out" ]; then
            mkdir -p "$(dirname "$out")"
            echo '{"targets":[],"pass":true}' > "$out"
          fi
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/bpfcompat"

          # Create a minimal matrix YAML
          cat > /tmp/matrix.yaml <<'EOF'
          targets: []
          EOF

          mkdir -p /tmp/bpfcompat-reports

      - name: Run action with remote OCI artifact reference
        id: action
        uses: .
        continue-on-error: false
        with:
          build: "false"
          prebuilt: "never"
          binary: "./bin/bpfcompat"
          artifact: "ghcr.io/example/gadget:latest"
          matrix: "/tmp/matrix.yaml"
          out: "/tmp/bpfcompat-reports/out.json"

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with remote OCI artifact, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly handled remote OCI artifact reference"
